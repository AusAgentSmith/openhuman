when:
  - event: push
  - event: manual

# Tauri release builds take ~60-90 min (vendored CEF tauri-cli + full crate
# graph). Raise the pipeline ceiling well above the default 60 min.
timeout_minutes: 180

# Skip submodule init here; tauri-cef and tauri-plugin-notification are
# initialised inside build-deb below (public GitHub repos, no auth needed).
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  - name: run-tests
    image: rust:1.93-bookworm
    commands:
      - apt-get update -qq && apt-get install -y --no-install-recommends
          build-essential cmake pkg-config libssl-dev libasound2-dev
          libxdo-dev libxtst-dev libx11-dev libevdev-dev clang mold
          ca-certificates git >/dev/null
      - cargo test --test inference_provider_e2e --test json_rpc_e2e 2>&1
    when:
      - event: [push, manual]

  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: repo.indexarr.net/indexarr/openhuman-core
      registry: repo.indexarr.net
      username:
        from_secret: git_auth_token
      password:
        from_secret: git_auth_token
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      platforms: linux/amd64
    when:
      - event: [push, manual]
        branch: main

  - name: komodo-deploy
    image: alpine:3.23
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      KOMODO_API_KEY:
        from_secret: komodo_api_key
      KOMODO_API_SECRET:
        from_secret: komodo_api_secret
    commands:
      - apk add --no-cache bash git curl python3 >/dev/null
      - 'curl -sSf -H "Authorization: token $GIT_AUTH_TOKEN" -o /tmp/komodo-deploy.sh https://repo.indexarr.net/indexarr/ops/raw/branch/main/scripts/komodo-deploy.sh'
      - chmod +x /tmp/komodo-deploy.sh
      - STACK_NAME=prod-openhuman-core STACK_DIR=prod/openhuman-core IMAGE_NAME=repo.indexarr.net/indexarr/openhuman-core IMAGE_TAG=$CI_COMMIT_SHA bash /tmp/komodo-deploy.sh
    when:
      - event: [push, manual]
        branch: main

  # Builds the Linux desktop .deb and uploads it to the Forgejo generic
  # package registry at:
  #   /api/packages/indexarr/generic/openhuman-deb/<short-sha>/openhuman_<ver>_amd64.deb
  #
  # Note: first run is slow (~30–60 min) — the vendored tauri-cli and CEF
  # binary are compiled/downloaded fresh. Cargo deps are cached via the
  # cargo-registry/cargo-git named volumes on the CI agent.
  - name: build-deb
    image: rust:1.93-bookworm
    environment:
      CEF_PATH: /tmp/cef
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      # The | block runs under /bin/sh (dash) which lacks pipefail; wrap with bash.
      - |
        bash << 'SCRIPT'
        set -euo pipefail

        # ── system deps (GTK3 + WebKit + CEF X11/DRM + build tools) ──────────
        apt-get update -qq
        apt-get install -y --no-install-recommends \
          build-essential cmake pkg-config libssl-dev clang mold \
          libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          libatk1.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
          libx11-dev libxrandr-dev libxcomposite-dev libxdamage-dev libxext-dev \
          libxfixes-dev libxrender-dev libxtst-dev libxdo-dev libevdev-dev \
          libdrm-dev libgbm-dev libasound2-dev \
          git curl ca-certificates >/dev/null

        # ── Node.js 22 + pnpm ────────────────────────────────────────────────
        # Download to file first to avoid curl|bash pipe swallowing curl errors.
        curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh
        bash /tmp/nodesource.sh >/dev/null
        apt-get install -y nodejs >/dev/null
        npm install -g pnpm >/dev/null

        # ── submodules ────────────────────────────────────────────────────────
        # git submodule update --init --depth=1 can't resolve pinned SHAs that
        # aren't at a GitHub branch tip. Clone branch HEAD directly instead.
        rm -rf app/src-tauri/vendor/tauri-cef
        git clone --depth=1 --branch feat/cef \
          https://github.com/tinyhumansai/tauri-cef.git \
          app/src-tauri/vendor/tauri-cef
        rm -rf app/src-tauri/vendor/tauri-plugin-notification
        git clone --depth=1 \
          https://github.com/tinyhumansai/tauri-plugin-notification.git \
          app/src-tauri/vendor/tauri-plugin-notification

        # ── pnpm deps ────────────────────────────────────────────────────────
        cd app
        pnpm install --frozen-lockfile >/dev/null

        # ── vendored CEF-aware tauri-cli ─────────────────────────────────────
        TAURI_CLI_ROOT=/tmp/tauri-cli
        cargo install --root $TAURI_CLI_ROOT --locked \
          --path src-tauri/vendor/tauri-cef/crates/tauri-cli
        export PATH="$TAURI_CLI_ROOT/bin:$PATH"

        # ── build the .deb bundle ─────────────────────────────────────────────
        # tauri runs beforeBuildCommand ("pnpm run build:app") automatically.
        # Woodpecker sets CI=woodpecker; tauri-cli only accepts true/false — override.
        mkdir -p "$CEF_PATH"
        CI=true cargo tauri build --bundles deb -- --bin OpenHuman

        cd ..

        # ── push to Forgejo generic package registry ──────────────────────────
        curl -sSf -H "Authorization: token $GIT_AUTH_TOKEN" \
          -o /usr/local/bin/forgejo-api \
          https://repo.indexarr.net/indexarr/ops/raw/branch/main/scripts/forgejo-api.sh
        chmod +x /usr/local/bin/forgejo-api
        export FORGEJO_TOKEN="$GIT_AUTH_TOKEN"

        DEB_FILE=$(find app/src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
        DEB_FILENAME=$(basename "$DEB_FILE")
        SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-7)
        # Sanitise branch name for use as a registry path component.
        SAFE_BRANCH=$(echo "$CI_COMMIT_BRANCH" | sed 's|[^a-zA-Z0-9._-]|-|g')
        SLOT="$SAFE_BRANCH-$SHORT_SHA"

        # Forgejo generic packages are immutable; delete the slot first so a
        # re-run of the same SHA doesn't 409.
        forgejo-api DELETE \
          "/api/packages/indexarr/generic/openhuman-deb/$SLOT/$DEB_FILENAME" \
          --allow 404 >/dev/null

        forgejo-api PUT \
          "/api/packages/indexarr/generic/openhuman-deb/$SLOT/$DEB_FILENAME" \
          --upload "$DEB_FILE"

        echo "[build-deb] uploaded $DEB_FILENAME at openhuman-deb/$SLOT"
        SCRIPT
    when:
      - event: [push, manual]

  - name: discord-success
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Successful\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 5025616,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [success]

  - name: discord-failure
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Failed\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 15548997,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [failure]
